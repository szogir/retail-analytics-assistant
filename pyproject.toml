[project]
name = "retail-analytics-assistant"
version = "0.1.0"
description = "A small, evaluated text-to-SQL assistant over a synthetic discount-retail dataset."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.60",        # Claude SDK (structured outputs via Pydantic)
    "duckdb>=1.1",            # embedded analytical database (single file, read-only mode)
    "numpy>=1.26",            # synthetic data generation
    "polars>=1.0",            # dataframes for generation and result handling
    "pydantic>=2.7",          # typed models and validation of LLM output
    "pydantic-settings>=2.3", # configuration from environment / .env
    "pyyaml>=6.0",            # semantic layer, golden set and config files
    "rich>=13.7",             # readable terminal output for the CLI and reports
    "sqlglot>=25.0",          # SQL parsing for the safety validator
    "typer>=0.12",            # command-line interface
]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retail_assistant"]

# --- Tooling -----------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: errors, I: import order, B: likely bugs, UP: modern syntax,
# SIM: simplifications, S: security checks (bandit rules).
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # plain asserts are the normal way to write pytest tests

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["retail_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real LLM API (excluded by default; run with -m live)"]
addopts = "-m 'not live'"
