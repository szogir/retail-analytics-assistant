id: '102'
questions:
  en: In which month of 2024 was Austria's average basket lowest? Return month number and euro value;
    ties go to the earlier month.
  hu: 2024 melyik hónapjában volt a legalacsonyabb az osztrák átlagos kosárérték? Hónapszámot és euróértéket
    kérek; holtversenyben a korábbi hónapot.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
- 3
- 4
- 5
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    MONTH(sales_date) AS m,
    SUM(net_eur) / COUNT(DISTINCT receipt_id) AS b
  FROM valid
  WHERE
    country_code = 'AT' AND YEAR(sales_date) = 2024 AND NOT is_return
  GROUP BY
    m
  ORDER BY
    b,
    m
  LIMIT 1
order_sensitive: false
notes: Tests ranking of ratios because the lowest Austrian monthly non-return net receipt average in 2024
  is selected after each monthly basket is computed.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
reviewed: true
