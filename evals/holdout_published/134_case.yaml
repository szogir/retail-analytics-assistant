id: '134'
questions:
  en: What were net sales in euro in week 53 of fiscal year 2023?
  hu: Mennyi volt a nettó árbevétel euróban a 2023-as pénzügyi év 53. hetében?
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(v.net_eur)
  FROM valid AS v
  JOIN dim_date AS d
    ON d.date = v.sales_date
  WHERE
    d.fiscal_year = 2023 AND d.fiscal_week = 53
order_sensitive: false
notes: Tests the short final fiscal week because week 53 of fiscal 2023 covers February 28 and 29, 2024
  under seven-day blocks from March 1.
