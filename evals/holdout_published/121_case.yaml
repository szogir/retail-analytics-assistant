id: '121'
questions:
  en: How many receipts in Hungary in 2025 contained at least three distinct products?
  hu: 2025-ben hány magyar bizonylaton szerepelt legalább három különböző termék?
user: carla
as_of_date: '2026-10-04'
category: composition
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    COUNT(*)
  FROM (
    SELECT
      receipt_id
    FROM valid
    WHERE
      country_code = 'HU' AND YEAR(sales_date) = 2025 AND NOT is_return
    GROUP BY
      receipt_id
    HAVING
      COUNT(DISTINCT product_id) >= 3
  )
order_sensitive: false
notes: Tests receipt-level deduplication because Hungarian receipts are counted only after finding at
  least three distinct products within each 2025 sales receipt.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only|return.*exclud
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
