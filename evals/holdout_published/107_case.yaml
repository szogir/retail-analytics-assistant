id: '107'
questions:
  en: Which three products did we sell the most units of in Hungary from 22 to 28 September 2025? Give
    IDs and units; ties go to smaller IDs.
  hu: Melyik három termékből adtuk el a legtöbb darabot Magyarországon 2025. szeptember 22–28. között?
    Azonosítót és darabszámot kérek; holtversenyben a kisebb azonosító döntsön.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    product_id,
    SUM(quantity) AS q
  FROM valid
  WHERE
    country_code = 'HU'
    AND NOT is_return
    AND sales_date BETWEEN '2025-09-22' AND '2025-09-28'
  GROUP BY
    product_id
  ORDER BY
    q DESC,
    product_id
  LIMIT 3
order_sensitive: true
notes: Tests product ranking and implicit sold-unit semantics because valid non-return quantities within
  the specified Hungarian week determine the top three product IDs.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sold|sales.only
  hu:
  - visszáru.*(kizár|nélkül)|eladott|értékesített
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
