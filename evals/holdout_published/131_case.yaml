id: '131'
questions:
  en: How many store-date combinations had negative total net sales in euro in 2025?
  hu: 2025-ben hány üzlet–nap kombinációnál volt negatív az összes nettó árbevétel euróban?
user: carla
as_of_date: '2026-10-04'
category: aggregation
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    COUNT(*)
  FROM (
    SELECT
      store_id,
      sales_date
    FROM valid
    WHERE
      YEAR(sales_date) = 2025
    GROUP BY
      store_id,
      sales_date
    HAVING
      SUM(net_eur) < 0
  )
order_sensitive: false
notes: Tests a post-aggregation sign condition because store-date net euro totals are formed first and
  only negative calendar-2025 combinations are counted.
tags: []
assumption_patterns: {}
answer_shape: nonempty
reviewed: true
