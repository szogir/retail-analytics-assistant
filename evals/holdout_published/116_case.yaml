id: '116'
questions:
  en: For 2025 by country, show gross sales, discounts, VAT and net sales, all in euro.
  hu: 2025-re országonként mutasd meg a bruttó árbevételt, az engedményeket, az áfát és a nettó árbevételt,
    euróban.
user: carla
as_of_date: '2026-10-04'
category: composition
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    country_code,
    SUM(gross_eur),
    SUM(discount_eur),
    SUM(vat_eur),
    SUM(net_eur)
  FROM valid
  WHERE
    YEAR(sales_date) = 2025
  GROUP BY
    country_code
order_sensitive: false
notes: Tests measure separation because country totals for signed gross, discounts, VAT and net retain
  returns and use daily euro conversion consistently.
tags:
