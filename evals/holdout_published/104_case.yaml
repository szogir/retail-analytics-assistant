id: '104'
questions:
  en: How much revenue in euro did returns subtract in fiscal year 2024, by country? Give positive deduction
    amounts.
  hu: Mennyi bevételt vont le euróban a visszáru a 2024-es pénzügyi évben, országonként? A levonást pozitív
    összegként kérem.
user: carla
as_of_date: '2026-10-04'
category: aggregation
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    country_code,
    -SUM(net_eur)
  FROM valid
  WHERE
    is_return AND sales_date BETWEEN '2024-03-01' AND '2025-02-28'
  GROUP BY
    country_code
order_sensitive: false
notes: Tests signed return revenue because fiscal-2024 return-line net euro totals are negated to report
  positive deductions separately by country.
tags:
- default_assumption
assumption_patterns:
  en:
  - \bnet\b
  hu:
  - nettó
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
