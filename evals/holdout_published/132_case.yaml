id: '132'
questions:
  en: By Hungarian region, what was the average daily number of receipts in 2025?
  hu: Magyar régiónként átlagosan hány bizonylat jutott egy napra 2025-ben?
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    region_name,
    CAST(COUNT(DISTINCT receipt_id) AS DOUBLE) / COUNT(DISTINCT sales_date)
  FROM valid
  WHERE
    country_code = 'HU' AND YEAR(sales_date) = 2025 AND NOT is_return
  GROUP BY
    region_name
order_sensitive: false
notes: Tests implicit receipt and trading-day conventions because each Hungarian region's non-return receipt
  count is divided by its own distinct trading dates in 2025.
tags:
- default_assumption
assumption_patterns:
  en:
  - trading|open|sales days
  hu:
  - nyitva|értékesítési nap|forgalmazási nap
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
