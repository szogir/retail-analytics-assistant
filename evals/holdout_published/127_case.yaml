id: '127'
questions:
  en: For each country, what fraction of 2025 net milk sales in euro came from private labels?
  hu: Országonként a 2025-ös, euróban mért nettó tejárbevétel mekkora része volt saját márkás? Törtet
    kérek.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    country_code,
    SUM(net_eur) FILTER(WHERE
      is_private_label) / SUM(net_eur)
  FROM valid
  WHERE
    YEAR(sales_date) = 2025
    AND (
      name_en LIKE '%Whole milk 1 l%' OR name_en LIKE '%Semi-skimmed milk 1 l%'
    )
  GROUP BY
    country_code
order_sensitive: false
notes: Tests the documented milk group and a scoped share because private-label net euro milk revenue
  is divided by all milk revenue separately for each country in 2025.
tags:
- default_assumption
assumption_patterns:
  en:
  - whole
  - semi.?skimmed
  hu:
  - teljes
  - félzsíros
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
