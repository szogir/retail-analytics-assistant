id: '135'
questions:
  en: What was the fractional change in net sales in euro between the last two complete calendar months,
    by country?
  hu: Országonként mennyivel változott a nettó árbevétel euróban az utolsó két teljes naptári hónap között?
    Törtben kérem.
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    country_code,
    SUM(net_eur) FILTER(WHERE
      MONTH(sales_date) = 9) / NULLIF(SUM(net_eur) FILTER(WHERE
      MONTH(sales_date) = 8), 0) - 1
  FROM valid
  WHERE
    sales_date BETWEEN '2026-08-01' AND '2026-09-30'
  GROUP BY
    country_code
order_sensitive: false
notes: Tests two relative complete months because the fixed evaluation date makes September versus August
  2026 the country-level net euro growth comparison.
tags: []
assumption_patterns: {}
