id: '130'
questions:
  en: Which product had the largest returned quantity in 2025? Return product ID and positive returned
    units; ties go to smaller IDs.
  hu: Melyik termékből hozták vissza a legtöbb darabot 2025-ben? Termékazonosítót és pozitív visszárudarabszámot
    kérek; holtversenyben a kisebb azonosító döntsön.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    product_id,
    -SUM(quantity) AS returned
  FROM valid
  WHERE
    YEAR(sales_date) = 2025 AND is_return
  GROUP BY
    product_id
  ORDER BY
    returned DESC,
    product_id
  LIMIT 1
order_sensitive: false
notes: Tests returned-unit ranking because negative return quantities are negated and summed per product
  before selecting the largest positive returned count.
tags: []
assumption_patterns: {}
answer_shape: nonempty
