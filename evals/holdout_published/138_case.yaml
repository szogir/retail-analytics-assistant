id: '138'
questions:
  en: What fraction of Hungary's 2025 net sales in euro came from its top three stores combined? Break
    store ties by ID.
  hu: A 2025-ös magyar nettó euróárbevétel mekkora része származott a három legnagyobb árbevételű üzletből
    együttesen? Törtet kérek; üzletholtversenyben az azonosító döntsön.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), s AS (
    SELECT
      store_id,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      country_code = 'HU' AND YEAR(sales_date) = 2025
    GROUP BY
      store_id
  )
  SELECT
    (
      SELECT
        SUM(n)
      FROM (
        SELECT
          n
        FROM s
        ORDER BY
          n DESC,
          store_id
        LIMIT 3
      )
    ) / (
      SELECT
        SUM(n)
      FROM s
    )
order_sensitive: false
notes: Tests concentration after ranking because the top three Hungarian store net euro totals are summed
  and divided by all Hungarian net euro sales in 2025.
