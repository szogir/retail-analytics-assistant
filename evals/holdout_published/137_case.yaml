id: '137'
questions:
  en: Which store led each Hungarian region in 2025 net sales in euro? Return region, store ID and value;
    ties go to smaller store IDs.
  hu: Melyik üzlet vezette az egyes magyar régiókat a 2025-ös nettó euróárbevétel alapján? Régiót, üzletazonosítót
    és értéket kérek; holtversenyben a kisebb azonosító döntsön.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), s AS (
    SELECT
      region_name,
      store_id,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      country_code = 'HU' AND YEAR(sales_date) = 2025
    GROUP BY
      region_name,
      store_id
  )
  SELECT
    *
  FROM s
  QUALIFY
    ROW_NUMBER() OVER (PARTITION BY region_name ORDER BY n DESC, store_id) = 1
order_sensitive: false
notes: Tests nested store ranking because each Hungarian region independently selects its highest calendar-2025
  net euro store total.
