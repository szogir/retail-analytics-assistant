id: '120'
questions:
  en: Between February and December 2025, which month had Austria's largest absolute month-on-month drop
    in net sales in euro? Give month number and signed change; ties go to the earlier month.
  hu: 2025 februárja és decembere között melyik hónapban csökkent a legtöbb euróval az osztrák nettó árbevétel
    az előző hónaphoz képest? Hónapszámot és előjeles változást kérek; holtversenyben a korábbi hónapot.
user: carla
as_of_date: '2026-10-04'
category: comparison
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), m AS (
    SELECT
      MONTH(sales_date) AS month_no,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      country_code = 'AT' AND YEAR(sales_date) = 2025
    GROUP BY
      month_no
  ), changes AS (
    SELECT
      month_no,
      n - LAG(n) OVER (ORDER BY month_no) AS delta
    FROM m
  )
  SELECT
    month_no,
    delta
  FROM changes
  WHERE
    delta < 0
  ORDER BY
    delta,
    month_no
  LIMIT 1
order_sensitive: false
notes: Tests a lagged absolute decrease because Austrian monthly net euro totals in 2025 are compared
  with the preceding month and the most negative change is selected.
