id: '103'
questions:
  en: In 2025, how much higher was Hungary's average daily net sales than Austria's, in euro? Return the
    signed difference.
  hu: 2025-ben mennyivel volt magasabb a magyar átlagos napi nettó árbevétel az osztráknál, euróban? Előjeles
    különbséget kérek.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), c AS (
    SELECT
      country_code,
      SUM(net_eur) / COUNT(DISTINCT sales_date) AS a
    FROM valid
    WHERE
      YEAR(sales_date) = 2025
    GROUP BY
      country_code
  )
  SELECT
    SUM(CASE WHEN country_code = 'HU' THEN a ELSE -a END)
  FROM c
order_sensitive: false
notes: Tests the implicit daily denominator because each country's calendar-2025 net euro sales use that
  country's own trading dates before subtracting Austria from Hungary.
tags:
- default_assumption
assumption_patterns:
  en:
  - trading|open|sales days
  hu:
  - nyitva|értékesítési nap|forgalmazási nap
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
