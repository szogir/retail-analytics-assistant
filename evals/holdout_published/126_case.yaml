id: '126'
questions:
  en: For each country, how many stores recorded sales on 1 June 2025? Include countries with zero active
    stores.
  hu: Országonként hány üzletben volt eladás 2025. június 1-jén? A nulla aktív üzlettel rendelkező ország
    is szerepeljen.
user: carla
as_of_date: '2026-10-04'
category: coverage
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    s.country_code,
    COUNT(DISTINCT v.store_id)
  FROM dim_store AS s
  LEFT JOIN valid AS v
    ON s.store_id = v.store_id AND v.sales_date = '2025-06-01' AND NOT v.is_return
  WHERE
    NOT s.is_test_store
  GROUP BY
    s.country_code
order_sensitive: false
notes: Tests zero-preserving country coverage because real-store activity on the specified date is counted
  against both countries, including the closed-country zero.
tags:
- default_assumption
assumption_patterns:
  en:
  - test
  hu:
  - teszt
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
