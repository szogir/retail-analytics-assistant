id: '105'
questions:
  en: Which category had the highest private-label share of revenue in Hungary in 2025? Give the English
    category and fractional share, using euro revenue; break ties alphabetically.
  hu: Melyik kategóriában volt a legnagyobb a saját márkás termékek bevételi aránya Magyarországon 2025-ben?
    Angol kategórianevet és törtben megadott arányt kérek, euróban számolt bevétellel; holtversenyben
    betűrend döntsön.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    category_en,
    SUM(net_eur) FILTER(WHERE
      is_private_label) / SUM(net_eur) AS share
  FROM valid
  WHERE
    country_code = 'HU' AND YEAR(sales_date) = 2025
  GROUP BY
    category_en
  ORDER BY
    share DESC,
    category_en
  LIMIT 1
order_sensitive: false
notes: Tests category-specific shares because the Hungarian category with the highest private-label net-revenue
  fraction is selected after computing all category ratios for 2025.
tags:
