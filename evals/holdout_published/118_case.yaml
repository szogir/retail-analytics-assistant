id: '118'
questions:
  en: For each category, give fractional growth in units sold from 2024 to 2025, using English category
    names.
  hu: Kategóriánként add meg az eladott darabszám növekedését 2024-ről 2025-re, törtben és angol kategórianevekkel.
user: carla
as_of_date: '2026-10-04'
category: comparison
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    category_en,
    CAST(SUM(quantity) FILTER(WHERE
      YEAR(sales_date) = 2025) AS DOUBLE) / NULLIF(SUM(quantity) FILTER(WHERE
      YEAR(sales_date) = 2024), 0) - 1
  FROM valid
  WHERE
    YEAR(sales_date) IN (2024, 2025) AND NOT is_return
  GROUP BY
    category_en
order_sensitive: false
notes: Tests unit rather than revenue growth because each category's non-return quantity total in calendar
  2025 is divided by its 2024 sold-unit base.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only|return.*exclud
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
