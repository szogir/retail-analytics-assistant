id: '101'
questions:
  en: How was Hungary's 2024 revenue split between regions? Give region names and fractions of the Hungarian
    total in euro.
  hu: Hogyan oszlott meg a 2024-es magyar bevétel a régiók között? Régiónevet és az euróban mért magyar
    összegből való részesedést kérek, törtben.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    region_name,
    SUM(net_eur) / SUM(SUM(net_eur)) OVER ()
  FROM valid
  WHERE
    country_code = 'HU' AND YEAR(sales_date) = 2024
  GROUP BY
    region_name
order_sensitive: false
notes: Tests a within-country revenue share because Hungarian region net euro totals are divided by the
  Hungarian, not chain-wide, calendar-2024 total.
tags:
- default_assumption
assumption_patterns:
  en:
  - \bnet\b
  hu:
  - nettó
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
