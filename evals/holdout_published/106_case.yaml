id: '106'
questions:
  en: Show Hungary's receipt counts for all twelve months of fiscal year 2024. Return the fiscal month
    number and count.
  hu: Mutasd meg a magyar bizonylatszámot a 2024-es pénzügyi év mind a tizenkét hónapjára. Pénzügyi hónapszámot
    és darabszámot kérek.
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    (
      (
        MONTH(sales_date) + 9
      ) % 12
    ) + 1 AS fm,
    COUNT(DISTINCT receipt_id)
  FROM valid
  WHERE
    country_code = 'HU'
    AND NOT is_return
    AND sales_date BETWEEN '2024-03-01' AND '2025-02-28'
  GROUP BY
    fm
  ORDER BY
    fm
order_sensitive: true
notes: Tests fiscal sequencing and implicit receipt scope because fiscal 2024 spans March 2024 through
  February 2025 and counts distinct non-return Hungarian receipts per fiscal month.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only
  - March
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
  - március
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
