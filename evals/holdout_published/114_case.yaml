id: '114'
questions:
  en: What was the net average basket in euro in Austria on 25 December 2025?
  hu: Mekkora volt a nettó átlagos kosárérték euróban Ausztriában 2025. december 25-én?
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
- 5
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(net_eur) / NULLIF(COUNT(DISTINCT receipt_id), 0)
  FROM valid
  WHERE
    country_code = 'AT' AND sales_date = '2025-12-25' AND NOT is_return
order_sensitive: false
notes: Tests an undefined ratio on a covered holiday because Austria has no sales receipts that day, so
  basket value is NULL and the zero denominator must be stated.
tags:
- default_assumption
assumption_patterns:
  en:
  - no.*receipts|zero.*receipts|undefined|denominator
  - exclud.*return|without.*return|sales.only|return.*exclud
  hu:
  - nincs.*bizonylat|nulla.*bizonylat|nem értelmezhető|nevező
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: 'null'
reviewed: true
