id: '123'
questions:
  en: What percentage of receipts in Hungary in 2025 contained only private-label products? Return a 0–100
    percentage.
  hu: A magyar bizonylatok hány százalékán szerepeltek kizárólag saját márkás termékek 2025-ben? 0–100
    közötti százalékot kérek.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), r AS (
    SELECT
      receipt_id,
      BOOL_AND(CAST(is_private_label AS BOOLEAN)) AS only_pl
    FROM valid
    WHERE
      country_code = 'HU' AND YEAR(sales_date) = 2025 AND NOT is_return
    GROUP BY
      receipt_id
  )
  SELECT
    100.0 * COUNT(*) FILTER(WHERE
      only_pl) / COUNT(*)
  FROM r
order_sensitive: false
notes: Tests an all-items receipt condition because only Hungarian receipts whose every product is private-label
  enter the numerator, expressed as a percentage.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only|return.*exclud
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
reviewed: true
reviewed_on: '2026-10-04'
reviewed_by: Richard
