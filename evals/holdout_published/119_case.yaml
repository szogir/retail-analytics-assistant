id: '119'
questions:
  en: On how many days in 2025 did Hungary's net sales in euro exceed its average daily net sales for
    that year?
  hu: 2025-ben hány napon haladta meg a magyar nettó árbevétel euróban az adott év átlagos napi nettó
    árbevételét?
user: carla
as_of_date: '2026-10-04'
category: comparison
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), daily AS (
    SELECT
      sales_date,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      country_code = 'HU' AND YEAR(sales_date) = 2025
    GROUP BY
      sales_date
  )
  SELECT
    COUNT(*)
  FROM daily
  WHERE
    n > (
      SELECT
        AVG(n)
      FROM daily
    )
order_sensitive: false
notes: Tests a two-stage daily threshold because Hungarian trading-day net euro totals are compared with
  their calendar-2025 mean before counting above-average dates.
tags:
- default_assumption
assumption_patterns:
  en:
  - trading|open|sales days
  hu:
  - nyitva|értékesítési nap|forgalmazási nap
answer_shape: nonempty
reviewed: true
