id: '043'
questions:
  en: Show cumulative net sales in euro at the end of each calendar quarter of 2025. Return quarter number
    and cumulative total.
  hu: Mutasd meg a 2025-ös naptári negyedévek végéig felhalmozott nettó árbevételt euróban. Negyedévsorszámot
    és halmozott összeget kérek.
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), q AS (
    SELECT
      QUARTER(sales_date) AS quarter_no,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      YEAR(sales_date) = 2025
    GROUP BY
      quarter_no
  )
  SELECT
    quarter_no,
    SUM(n) OVER (ORDER BY quarter_no)
  FROM q
  ORDER BY
    quarter_no
order_sensitive: true
notes: Tests cumulative aggregation because each calendar-quarter endpoint includes all net euro sales
  since January 1, 2025 rather than only that quarter.
