id: '002'
questions:
  en: What were our total net sales in euro last month?
  hu: Mekkora volt az összes nettó árbevételünk euróban a múlt hónapban?
user: carla
as_of_date: 2026-10-04
category: time
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
notes: Tests relative-month resolution because the fixed evaluation date makes September 2026 the last
  complete calendar month.
reference_sql: |
  SELECT SUM((f.gross_amount - f.discount_amount - f.vat_amount) / fx.eur_rate) AS net_sales_eur
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN fx_rate fx ON fx.rate_date = f.sales_date AND fx.currency = f.currency
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND f.sales_date >= DATE '2026-09-01'
    AND f.sales_date < DATE '2026-10-01'
reviewed: true
reviewed_on: 2026-10-04
reviewed_by: Richard
