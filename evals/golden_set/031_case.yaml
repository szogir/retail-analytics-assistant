id: '031'
questions:
  en: What was the average basket in euro at Graz Nord during calendar Q1 2025?
  hu: Mennyi volt az átlagos kosárérték euróban a Graz Nord üzletben 2025 első naptári negyedévében?
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
- 5
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(net_eur) / COUNT(DISTINCT receipt_id)
  FROM valid
  WHERE
    store_name = 'Graz Nord'
    AND NOT is_return
    AND sales_date BETWEEN '2025-01-01' AND '2025-03-31'
order_sensitive: false
notes: Tests the implicit basket convention by averaging non-return net euro receipt totals at Graz Nord
  during calendar Q1 2025.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
