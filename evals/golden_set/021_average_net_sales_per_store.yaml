id: '021'
questions:
  en: What were the average net sales in euro per store in 2025?
  hu: Mekkora volt az átlagos nettó árbevétel euróban üzletenként 2025-ben?
user: carla
as_of_date: 2026-10-04
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
notes: Tests store-level averaging because total calendar-2025 net euro sales are divided across the 19
  real stores, excluding the test store from both sides.
reference_sql: |
  SELECT SUM((f.gross_amount - f.discount_amount - f.vat_amount) / fx.eur_rate) / COUNT(DISTINCT f.store_id) AS avg_net_sales_per_store_eur
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN fx_rate fx ON fx.rate_date = f.sales_date AND fx.currency = f.currency
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND f.sales_date >= DATE '2025-01-01'
    AND f.sales_date < DATE '2026-01-01'
