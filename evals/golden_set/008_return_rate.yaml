id: 008
questions:
  en: What was the return rate in fiscal year 2025?
  hu: Mekkora volt a visszáru-arány a 2025-ös pénzügyi évben?
user: carla
as_of_date: 2026-10-04
category: ratio
traps:
- 1
- 2
expected:
  kind: result
notes: Tests return-rate signs and denominators because returned quantities are negated and divided by
  sold quantities, yielding a fraction for fiscal 2025.
reference_sql: |
  SELECT SUM(CASE WHEN f.is_return THEN -f.quantity END) * 1.0
         / SUM(CASE WHEN NOT f.is_return THEN f.quantity END) AS return_rate
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN dim_date d ON d.date = f.sales_date
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND d.fiscal_year = 2025
