id: '036'
questions:
  en: What is our revenue in euro so far in fiscal year 2026?
  hu: Mennyi bevételünk volt eddig euróban a 2026-os pénzügyi évben?
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(net_eur)
  FROM valid
  WHERE
    sales_date BETWEEN '2026-03-01' AND '2026-10-03'
order_sensitive: false
notes: Tests partial fiscal-year revenue because fiscal 2026 begins March 1 and the available interval
  ends October 3, with revenue interpreted as net euro sales.
tags:
- default_assumption
assumption_patterns:
  en:
  - \bnet\b
  hu:
  - nettó
answer_shape: nonempty
reviewed: true
