id: "011"
questions:
  en: "How many public holidays did Hungary have in 2025?"
  hu: null
user: carla
as_of_date: 2026-10-04
category: reference
traps: [closures]
expected:
  kind: result
notes: >
  Needs the dim_holiday table. The question tests whether the assistant finds the right
  table (and the right country and year filter) instead of guessing from sales data.
reference_sql: |
  SELECT COUNT(*) AS holiday_count
  FROM dim_holiday
  WHERE country_code = 'HU'
    AND holiday_date >= DATE '2025-01-01'
    AND holiday_date < DATE '2026-01-01'
