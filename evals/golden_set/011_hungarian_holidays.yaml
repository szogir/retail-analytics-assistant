id: '011'
questions:
  en: How many public holidays did Hungary have in 2025?
  hu: Hány hivatalos ünnepnap volt Magyarországon 2025-ben?
user: carla
as_of_date: 2026-10-04
category: reference
traps:
- closures
expected:
  kind: result
notes: Tests reference-data selection because Hungarian public holidays in 2025 are counted from the holiday
  dimension rather than inferred from missing sales.
reference_sql: |
  SELECT COUNT(*) AS holiday_count
  FROM dim_holiday
  WHERE country_code = 'HU'
    AND holiday_date >= DATE '2025-01-01'
    AND holiday_date < DATE '2026-01-01'
reviewed: true
reviewed_on: 2026-10-04
reviewed_by: Richard
