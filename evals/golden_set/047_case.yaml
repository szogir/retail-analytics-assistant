id: '047'
questions:
  en: For each country, give its highest net-sales category in 2025, in euro. Return country, English
    category name and sales; break ties alphabetically.
  hu: Országonként melyik kategória nettó árbevétele volt a legnagyobb 2025-ben, euróban? Országot, angol
    kategórianevet és árbevételt kérek; holtversenyben betűrend döntsön.
user: carla
as_of_date: '2026-10-04'
category: ranking
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  ), c AS (
    SELECT
      country_code,
      category_en,
      SUM(net_eur) AS n
    FROM valid
    WHERE
      YEAR(sales_date) = 2025
    GROUP BY
      country_code,
      category_en
  )
  SELECT
    country_code,
    category_en,
    n
  FROM c
  QUALIFY
    ROW_NUMBER() OVER (PARTITION BY country_code ORDER BY n DESC, category_en) = 1
order_sensitive: false
notes: Tests ranking within groups because each country independently selects its highest net euro sales
  category for 2025 with the requested alphabetical tie-break.
