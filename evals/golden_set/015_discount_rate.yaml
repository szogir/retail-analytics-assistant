id: '015'
questions:
  en: What was the discount rate in 2025?
  hu: Mekkora volt az engedményarány 2025-ben?
user: carla
as_of_date: 2026-10-04
category: ratio
traps:
- 1
- 2
- 3
expected:
  kind: result
notes: Tests the implicit discount-rate definition because the result is signed euro discounts divided
  by signed euro gross sales for calendar 2025, not an average of line rates.
reference_sql: |
  SELECT SUM(f.discount_amount / fx.eur_rate)
           / SUM(f.gross_amount / fx.eur_rate) AS discount_rate
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN fx_rate fx ON fx.rate_date = f.sales_date AND fx.currency = f.currency
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND f.sales_date >= DATE '2025-01-01'
    AND f.sales_date < DATE '2026-01-01'
reviewed: true
