id: "015"
questions:
  en: "What was the discount rate in 2025, i.e. discounts as a share of gross sales?"
  hu: "Mekkora volt az engedményarány 2025-ben, vagyis az engedmények a bruttó árbevétel hányad részét tették ki?"
user: carla
as_of_date: 2026-10-04
category: ratio
traps: [1, 2, 3]
expected:
  kind: result
notes: >
  A ratio of two sums (both in euro), never an average of per-line or per-day rates. Both
  currencies must be converted before the division, otherwise HUF amounts dominate.
  Convention: all valid lines count, return lines included (their negative amounts are
  part of the sums), like net and gross sales in the other cases.
reference_sql: |
  SELECT SUM(f.discount_amount / fx.eur_rate)
           / SUM(f.gross_amount / fx.eur_rate) AS discount_rate
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN fx_rate fx ON fx.rate_date = f.sales_date AND fx.currency = f.currency
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND f.sales_date >= DATE '2025-01-01'
    AND f.sales_date < DATE '2026-01-01'
reviewed: false
reviewed_on: null
reviewed_by: null
