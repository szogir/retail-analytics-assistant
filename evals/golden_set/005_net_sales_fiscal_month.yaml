id: '005'
questions:
  en: What were the net sales in euro in fiscal month 3 of fiscal year 2025?
  hu: Mekkora volt a nettó árbevétel euróban a 2025-ös pénzügyi év 3. pénzügyi hónapjában?
user: carla
as_of_date: 2026-10-04
category: time
traps:
- 1
- 2
- 3
- 4
- fiscal
expected:
  kind: result
notes: Tests the fiscal-month offset because month three of fiscal 2025 is May 2025 rather than March.
reference_sql: |
  SELECT SUM((f.gross_amount - f.discount_amount - f.vat_amount) / fx.eur_rate) AS net_sales_eur
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  JOIN dim_date d ON d.date = f.sales_date
  JOIN fx_rate fx ON fx.rate_date = f.sales_date AND fx.currency = f.currency
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND d.fiscal_year = 2025
    AND d.fiscal_month = 3
