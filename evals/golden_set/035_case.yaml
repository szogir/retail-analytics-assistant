id: '035'
questions:
  en: How many units of milk did we sell in September 2026?
  hu: Mennyi tejet adtunk el 2026 szeptemberében, darabban?
user: carla
as_of_date: '2026-10-04'
category: aggregation
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(quantity)
  FROM valid
  WHERE
    NOT is_return
    AND (
      name_en LIKE '%Whole milk 1 l%' OR name_en LIKE '%Semi-skimmed milk 1 l%'
    )
    AND sales_date BETWEEN '2026-09-01' AND '2026-09-30'
order_sensitive: false
notes: Tests natural milk wording because the documented milk group includes whole and semi-skimmed one-litre
  products of both labels while sold units exclude returns.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sold|sales.only
  - whole
  - semi.?skimmed
  hu:
  - visszáru.*(kizár|nélkül)|eladott|értékesített
  - teljes
  - félzsíros
answer_shape: nonempty
reviewed: true
reviewed_on: 2026-10-04
reviewed_by: Richard
