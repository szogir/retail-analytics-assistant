id: '033'
questions:
  en: What share of bakery revenue came from private labels in 2025? Return a fraction.
  hu: A pékáru bevételének mekkora része származott saját márkás termékekből 2025-ben? Törtet kérek.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(net_eur) FILTER(WHERE
      is_private_label) / SUM(net_eur)
  FROM valid
  WHERE
    category_en = 'Bakery' AND YEAR(sales_date) = 2025
order_sensitive: false
