expected:
  kind: result
notes: Tests dimension-only filtering because operating-store counts exclude the test store even though
  no fact-table join is needed.
reference_sql: |
  SELECT country_code, COUNT(*) AS store_count
  FROM dim_store
  WHERE NOT is_test_store
  GROUP BY country_code
  ORDER BY country_code
