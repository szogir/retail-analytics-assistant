id: '032'
questions:
  en: How many receipts did we have in Hungary on weekends in 2025?
  hu: Hány bizonylatunk volt Magyarországon hétvégén 2025-ben?
user: carla
as_of_date: '2026-10-04'
category: aggregation
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    COUNT(DISTINCT receipt_id)
  FROM valid
  WHERE
    country_code = 'HU'
    AND NOT is_return
    AND YEAR(sales_date) = 2025
    AND ISODOW(sales_date) IN (6, 7)
order_sensitive: false
notes: Tests weekend receipt filtering by counting distinct non-return Hungarian receipts on Saturdays
  and Sundays in calendar 2025.
tags:
- default_assumption
assumption_patterns:
  en:
  - exclud.*return|without.*return|sales.only
  hu:
  - visszáru.*(kizár|nélkül)|visszárut.*nem|csak.*eladás
answer_shape: nonempty
reviewed: false
