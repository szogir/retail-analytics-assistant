id: '040'
questions:
  en: How many valid sales receipts were recorded in Austria on 5 January 2025?
  hu: Hány érvényes eladási bizonylatot rögzítettünk Ausztriában 2025. január 5-én?
user: carla
as_of_date: '2026-10-04'
category: time
traps:
- 1
- 2
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    COUNT(DISTINCT receipt_id)
  FROM valid
  WHERE
    country_code = 'AT' AND sales_date = '2025-01-05' AND NOT is_return
order_sensitive: false
notes: 'A covered Sunday on which Austrian stores are closed: COUNT is zero, not missing coverage.'
