id: 029
questions:
  en: What was our revenue in Budapest in the second half of 2024, in euro?
  hu: Mennyi bevételünk volt Budapesten 2024 második felében, euróban?
user: carla
as_of_date: '2026-10-04'
category: aggregation
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    SUM(net_eur)
  FROM valid
  WHERE
    city = 'Budapest' AND sales_date BETWEEN '2024-07-01' AND '2024-12-31'
order_sensitive: false
notes: Tests the revenue synonym and city scope by summing valid net euro sales across Budapest stores
  during July through December 2024.
tags:
- default_assumption
assumption_patterns:
  en:
  - \bnet\b
  hu:
