id: '003'
questions:
  en: How many receipts did we have in Hungary in 2025?
  hu: Hány bizonylatunk volt Magyarországon 2025-ben?
user: carla
as_of_date: 2026-10-04
category: aggregation
traps:
- 1
- 2
expected:
  kind: result
notes: Tests receipt grain because the answer counts distinct non-return sales receipts in Hungary during
  calendar 2025 rather than counting receipt lines.
reference_sql: |
  SELECT COUNT(DISTINCT f.receipt_id) AS receipt_count
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  WHERE NOT f.is_cancelled
    AND NOT f.is_return
    AND NOT s.is_test_store
    AND s.country_code = 'HU'
    AND f.sales_date >= DATE '2025-01-01'
    AND f.sales_date < DATE '2026-01-01'
