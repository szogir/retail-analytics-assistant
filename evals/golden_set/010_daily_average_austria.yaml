id: '010'
questions:
  en: What was the average daily net sales in euro in Austria in 2025?
  hu: Mekkora volt az átlagos napi nettó árbevétel euróban Ausztriában 2025-ben?
user: carla
as_of_date: 2026-10-04
category: ratio
traps:
- 1
- 2
- 4
- closures
expected:
  kind: result
notes: Tests the implicit trading-day convention because Austrian closed days are excluded from the denominator
  of calendar-2025 average daily net sales.
reference_sql: |
  SELECT SUM(f.gross_amount - f.discount_amount - f.vat_amount)
         / COUNT(DISTINCT f.sales_date) AS avg_daily_net_sales_eur
  FROM fact_sales f
  JOIN dim_store s ON s.store_id = f.store_id
  WHERE NOT f.is_cancelled
    AND NOT s.is_test_store
    AND s.country_code = 'AT'
    AND f.sales_date >= DATE '2025-01-01'
    AND f.sales_date < DATE '2026-01-01'
reviewed: false
reviewed_on: null
reviewed_by: null
