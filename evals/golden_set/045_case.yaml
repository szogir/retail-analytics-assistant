id: '045'
questions:
  en: What percentage of total net sales in euro came from each country in 2025? Use 0–100 percentages.
  hu: Az összes euróban mért nettó árbevétel hány százaléka származott az egyes országokból 2025-ben?
    0–100 közötti százalékot kérek.
user: carla
as_of_date: '2026-10-04'
category: ratio
traps:
- 1
- 2
- 3
- 4
expected:
  kind: result
reference_sql: |
  WITH valid AS (
    SELECT
      f.*,
      s.store_name,
      s.city,
      s.country_code,
      s.region_name,
      p.name_en,
      p.name_hu,
      p.category_en,
      p.is_private_label,
      (
        f.gross_amount - f.discount_amount - f.vat_amount
      ) / fx.eur_rate AS net_eur,
      f.gross_amount / fx.eur_rate AS gross_eur,
      f.discount_amount / fx.eur_rate AS discount_eur,
      f.vat_amount / fx.eur_rate AS vat_eur,
      f.gross_amount - f.discount_amount - f.vat_amount AS net_local
    FROM fact_sales AS f
    JOIN dim_store AS s
      USING (store_id)
    JOIN dim_product AS p
      USING (product_id)
    JOIN fx_rate AS fx
      ON f.sales_date = fx.rate_date AND f.currency = fx.currency
    WHERE
      NOT f.is_cancelled AND NOT s.is_test_store
  )
  SELECT
    country_code,
    100.0 * SUM(net_eur) / SUM(SUM(net_eur)) OVER ()
  FROM valid
  WHERE
    YEAR(sales_date) = 2025
  GROUP BY
    country_code
order_sensitive: false
notes: Tests percentage scaling because each country's calendar-2025 net euro sales share is multiplied
  by 100 against the same global total.
