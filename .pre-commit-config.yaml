# Checks that run automatically before every local commit.
# Install once with:  uv run pre-commit install
# Update hook versions with:  uv run pre-commit autoupdate
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # Blocks commits that accidentally contain API keys or other secrets.
  # (Pure Python, so it installs cleanly on Windows as well.)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        # These generated manifests contain verified SHA-256 digests, not credentials.
        exclude: ^(?:uv\.lock|evals/golden_set/candidate\.json|evals/golden_set/frozen\.json|evals/holdout_manifest\.json)$
